user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://lms-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location /doc.html {
            proxy_pass http://lms-backend:8080/doc.html;
            proxy_set_header Host $host;
        }

        location /swagger-resources {
            proxy_pass http://lms-backend:8080/swagger-resources;
            proxy_set_header Host $host;
        }

        location /v2/api-docs {
            proxy_pass http://lms-backend:8080/v2/api-docs;
            proxy_set_header Host $host;
        }

        location /webjars/ {
            proxy_pass http://lms-backend:8080/webjars/;
            proxy_set_header Host $host;
        }
    }
}
